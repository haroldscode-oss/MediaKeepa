[phases.setup]
nixPkgs = ["python311", "nodejs_22"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  "cd spark-template && npm install && npm run build && cd .."
]

[phases.build]
cmds = []

[start]
cmd = ". /opt/venv/bin/activate && python server.py"
