# Fix for Rollup optional dependency issue - clean install required
[phases.setup]
nixPkgs = ["python311", "nodejs_22"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  "cd spark-template && rm -rf node_modules package-lock.json && npm install && npm run build && cd .."
]

[phases.build]
cmds = []

[start]
cmd = ". /opt/venv/bin/activate && gunicorn -w 4 -b 0.0.0.0:8080 server:app"
