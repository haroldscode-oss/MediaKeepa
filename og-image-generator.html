<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaKeepa OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .og-image {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        /* Animated gradient background */
        .og-image::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                rgba(139, 92, 246, 0.3) 0%,
                transparent 50%,
                rgba(139, 92, 246, 0.3) 100%
            );
            animation: gradient 8s ease infinite;
        }
        
        @keyframes gradient {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
        }
        
        /* Pattern overlay */
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.5;
        }
        
        /* Content container */
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            text-align: center;
        }
        
        /* Beta badge - above logo with outline */
        .beta-badge {
            display: inline-block;
            background: #8B5CF6;
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
            border: 3px solid white;
        }
        
        /* Logo container */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 60px;
        }
        
        .logo-icon {
            width: 100px;
            height: 100px;
            position: relative;
        }
        
        .logo-icon svg {
            width: 100%;
            height: 100%;
            fill: #8B5CF6;
            filter: drop-shadow(0 0 0 3px white);
        }
        
        .logo-text {
            font-size: 80px;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: -1px;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
        }
        
        /* Description */
        .description {
            font-size: 32px;
            color: white;
            max-width: 900px;
            line-height: 1.5;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            font-weight: 500;
        }
        
        /* Instructions */
        .instructions {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            max-width: 300px;
            z-index: 1000;
        }
        
        .instructions h3 {
            margin: 0 0 10px 0;
            color: #667eea;
        }
        
        .instructions ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .instructions li {
            margin: 5px 0;
            color: #333;
        }
        
        .instructions button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .instructions button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h3>📸 Screenshot Instructions</h3>
        <ol>
            <li>Press <strong>Windows + Shift + S</strong></li>
            <li>Select the purple card area</li>
            <li>Save as <strong>og-image.png</strong></li>
            <li>Place in <code>spark-template/public/</code></li>
        </ol>
        <button onclick="this.parentElement.style.display='none'">Hide Instructions</button>
    </div>

    <div class="og-image">
        <div class="pattern"></div>
        <div class="content">
            <div class="beta-badge">BETA</div>
            <div class="logo-container">
                <div class="logo-icon">
                    <!-- MediaKeepa video camera icon in purple #8B5CF6 -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <path d="M232,208a8,8,0,0,1-8,8H32a8,8,0,0,1,0-16H224A8,8,0,0,1,232,208Zm0-152V168a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Zm-68,56a8,8,0,0,0-3.41-6.55l-40-28A8,8,0,0,0,108,84v56a8,8,0,0,0,12.59,6.55l40-28A8,8,0,0,0,164,112Z"></path>
                    </svg>
                </div>
                <span class="logo-text">MediaKeepa</span>
            </div>
            <div class="description">
                Download videos, audio & images from 1000+ platforms
            </div>
        </div>
    </div>
</body>
</html>
