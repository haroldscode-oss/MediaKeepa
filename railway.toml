[build]
builder = "nixpacks"

[nixpacks]
nixPkgsArchive = "e05605ec414618eab4a7a6aea8b38f6fbbcc8f08"

[nixpacks.phases.setup]
nixPkgs = ["python311", "nodejs_22"]

[nixpacks.phases.install]
cmds = [
  "pip install -r requirements.txt",
  "cd spark-template && npm install && npm run build && cd .."
]

[nixpacks.phases.build]
cmds = []

[deploy]
startCommand = "gunicorn -w 4 -b 0.0.0.0:${PORT:-8080} server:app"
