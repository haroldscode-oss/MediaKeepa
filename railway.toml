[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && cd spark-template && npm install && npm run build"

[deploy]
startCommand = "python server.py"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[nixpacks]
nixpkgsArchive = "e05605ec414618eab4a7a6aea8b38f6fbbcc8f08"

[nixpacks.phases.install]
nixPkgs = ["python311", "nodejs_22", "npm-9_x"]

[nixpacks.phases.setup]
nixPkgs = []

[[services]]
name = "mediakeepa"
